name: XRpg Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XRpg.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRpg-APK
          path: XRpg.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xrpg-v1.${{ github.run_number }}
          name: XRpg v1.${{ github.run_number }}
          generate_release_notes: true
          files: XRpg.apk
          make_latest: true
